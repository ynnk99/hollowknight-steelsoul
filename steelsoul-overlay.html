<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steel Soul Overlay</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap');
  html,body{
    margin:0; padding:0; background:transparent; overflow:hidden;
    font-family:'EB Garamond',Georgia,serif; color:#eef5f6;
  }
  .overlay-box{
    display:inline-flex; align-items:center; gap:16px;
    background:rgba(6,9,13,0.72);
    border:1px solid rgba(140,180,190,0.35);
    border-radius:10px;
    padding:14px 22px;
    box-shadow:0 0 28px rgba(0,0,0,0.5), inset 0 0 30px rgba(127,214,206,0.06);
    backdrop-filter:blur(2px);
  }
  .attempt-block{text-align:center; padding-right:16px; border-right:1px solid rgba(140,180,190,0.25);}
  .attempt-label{font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:#9fb3ba;}
  .attempt-number{font-family:'Cinzel',serif; font-size:46px; font-weight:700; color:#bdf3ec; line-height:1; text-shadow:0 0 18px rgba(127,214,206,0.5);}
  .info-block{display:flex; flex-direction:column; gap:4px; min-width:140px;}
  .info-row{font-size:14px; display:flex; align-items:center; gap:6px;}
  .info-row .k{color:#9fb3ba; font-style:italic; font-size:12px;}
  .info-row .v{color:#eef5f6; font-weight:600;}
  .pb-flag{
    font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.06em; color:#0a0f0c;
    background:linear-gradient(120deg,#c7a75e,#e3c988); border-radius:5px; padding:2px 8px; width:fit-content;
  }
  .success-flag{
    font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.06em; color:#0a0f0c;
    background:linear-gradient(120deg,#5cae74,#82d69a); border-radius:5px; padding:2px 8px; width:fit-content;
  }
  .running-flag{
    font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.06em; color:#0a0f0c;
    background:linear-gradient(120deg,#7fd6ce,#bdf3ec); border-radius:5px; padding:2px 8px; width:fit-content;
  }
  .fail-flag{
    font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.06em; color:#eef5f6;
    background:rgba(192,82,74,0.55); border-radius:5px; padding:2px 8px; width:fit-content;
  }
  .hidden{display:none;}
</style>
</head>
<body>
  <div class="overlay-box" id="overlay-box">
    <div class="attempt-block">
      <div class="attempt-label">Versuch</div>
      <div class="attempt-number" id="ov-attempt">–</div>
    </div>
    <div class="info-block">
      <div class="info-row"><span class="k">Bosse (aktuell):</span><span class="v" id="ov-bosses">–</span></div>
      <div class="info-row"><span class="k">PB:</span><span class="v" id="ov-pb">–</span></div>
      <div id="ov-flag-wrap"></div>
    </div>
  </div>

<script src="steelsoul-config.js"></script>
<script src="steelsoul-data.js"></script>
<script>
  function render(runs, stats){
    document.getElementById('ov-attempt').textContent = stats.currentAttempt ?? '–';
    document.getElementById('ov-pb').textContent = stats.bestBossesKilled ? (stats.bestBossesKilled + ' Bosse') : '–';

    const current = stats.currentRun;
    const bossesEl = document.getElementById('ov-bosses');
    const flagWrap = document.getElementById('ov-flag-wrap');
    flagWrap.innerHTML = '';

    if(!current){
      bossesEl.textContent = '–';
    } else {
      bossesEl.textContent = current.bossesKilled + ' Bosse';
      if(current.running){
        flagWrap.innerHTML = '<div class="running-flag">⏳ LÄUFT GERADE</div>';
      } else if(current.success){
        flagWrap.innerHTML = '<div class="success-flag">✓ GESCHAFFT</div>';
      } else if(current.failed){
        flagWrap.innerHTML = '<div class="fail-flag">✕ ' + (current.deathCause || 'gescheitert') + '</div>';
      }
      if(current.bossesKilled && current.bossesKilled >= stats.bestBossesKilled){
        flagWrap.innerHTML += '<div class="pb-flag">🏆 NEUER PB</div>';
      }
    }
    if(stats.latestRunHasClips){
      flagWrap.innerHTML += '<div class="running-flag">🎬 Clip verfügbar</div>';
    }
  }

  // Overlay bleibt bei Fehlern einfach beim letzten bekannten Stand stehen
  SteelSoul.startPolling(render, (err) => console.error('Steel Soul Overlay:', err));
</script>
</body>
</html>
