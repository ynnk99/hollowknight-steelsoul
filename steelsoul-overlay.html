<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steel Soul Overlay</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap');
  html,body{
    margin:0; padding:0; background:transparent; overflow:hidden;
    font-family:'EB Garamond',Georgia,serif; color:#f1f7f8;
  }
  .overlay-box{
    position:relative; display:inline-flex; align-items:center; gap:18px;
    background:linear-gradient(180deg, rgba(15,22,30,0.85), rgba(6,9,14,0.85));
    border:1px solid rgba(199,167,94,0.45);
    border-radius:10px;
    padding:14px 24px;
    box-shadow:0 0 32px rgba(0,0,0,0.55), inset 0 0 30px rgba(127,214,206,0.05);
    backdrop-filter:blur(2px);
  }
  .overlay-box .corner{position:absolute; width:9px; height:9px; border:1px solid #c7a75e; opacity:0.6;}
  .overlay-box .c-tl{top:5px; left:5px; border-right:none; border-bottom:none;}
  .overlay-box .c-tr{top:5px; right:5px; border-left:none; border-bottom:none;}
  .overlay-box .c-bl{bottom:5px; left:5px; border-right:none; border-top:none;}
  .overlay-box .c-br{bottom:5px; right:5px; border-left:none; border-top:none;}

  .attempt-block{text-align:center; padding-right:18px; border-right:1px solid rgba(140,185,195,0.28);}
  .attempt-label{font-family:'Cinzel',serif; font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase; color:#9fb3ba;}
  .attempt-number{font-family:'Cinzel',serif; font-size:44px; font-weight:700; color:#c3f5ee; line-height:1; text-shadow:0 0 20px rgba(127,214,206,0.55);}
  .info-block{display:flex; flex-direction:column; gap:5px; min-width:150px;}
  .info-row{font-size:13.5px; display:flex; align-items:center; gap:6px;}
  .info-row .k{color:#9fb3ba; font-style:italic; font-size:11.5px;}
  .info-row .v{color:#f1f7f8; font-weight:600;}
  .flag{
    font-family:'Cinzel',serif; font-size:10.5px; letter-spacing:0.06em; border-radius:5px; padding:2px 9px; width:fit-content;
  }
  .flag-pb{color:#0a0f0c; background:linear-gradient(120deg,#c7a75e,#e9cf94);}
  .flag-running{color:#0a0f0c; background:linear-gradient(120deg,#7fd6ce,#c3f5ee);}
  .flag-success{color:#0a0f0c; background:linear-gradient(120deg,#5cae74,#8fe0a8);}
  .flag-fail{color:#f1f7f8; background:rgba(192,82,74,0.6);}
</style>
</head>
<body>
  <div class="overlay-box" id="overlay-box">
    <span class="corner c-tl"></span><span class="corner c-tr"></span><span class="corner c-bl"></span><span class="corner c-br"></span>
    <div class="attempt-block">
      <div class="attempt-label">Versuch</div>
      <div class="attempt-number" id="ov-attempt">–</div>
    </div>
    <div class="info-block">
      <div class="info-row"><span class="k">Bosse (aktuell):</span><span class="v" id="ov-bosses">–</span></div>
      <div class="info-row"><span class="k">PB:</span><span class="v" id="ov-pb">–</span></div>
      <div id="ov-flag-wrap" style="display:flex; flex-direction:column; gap:4px;"></div>
    </div>
  </div>

<script src="steelsoul-config.js"></script>
<script src="steelsoul-data.js"></script>
<script>
  function render(runs, stats){
    document.getElementById('ov-attempt').textContent = stats.currentAttempt ?? '–';
    document.getElementById('ov-pb').textContent = stats.bestBossesKilled ? (stats.bestBossesKilled + ' Bosse') : '–';

    const current = stats.currentRun;
    const bossesEl = document.getElementById('ov-bosses');
    const flagWrap = document.getElementById('ov-flag-wrap');
    flagWrap.innerHTML = '';

    if(!current){
      bossesEl.textContent = '–';
    } else {
      bossesEl.textContent = current.bossesKilled + ' Bosse';
      if(current.running){
        flagWrap.innerHTML += '<div class="flag flag-running">⏳ LÄUFT GERADE</div>';
      } else if(current.success){
        flagWrap.innerHTML += '<div class="flag flag-success">✓ GESCHAFFT</div>';
      } else if(current.failed){
        flagWrap.innerHTML += '<div class="flag flag-fail">✕ ' + (current.deathCause || 'gescheitert') + '</div>';
      }
      if(current.bossesKilled && current.bossesKilled >= stats.bestBossesKilled){
        flagWrap.innerHTML += '<div class="flag flag-pb">🏆 NEUER PB</div>';
      }
    }
    if(stats.latestRunHasClips){
      flagWrap.innerHTML += '<div class="flag flag-running">🎬 Clip verfügbar</div>';
    }
  }

  // Overlay bleibt bei Fehlern einfach beim letzten bekannten Stand stehen
  SteelSoul.startPolling(render, (err) => console.error('Steel Soul Overlay:', err));
</script>
</body>
</html>
