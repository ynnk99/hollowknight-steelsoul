<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hollow Knight Overlay</title>
<script src="vendor/papaparse.min.js"></script>
<style>
  @font-face{
    font-family:'Cinzel'; font-style:normal; font-weight:600; font-display:swap;
    src:url('fonts/cinzel-latin-600-normal.woff2') format('woff2');
  }
  @font-face{
    font-family:'Cinzel'; font-style:normal; font-weight:700; font-display:swap;
    src:url('fonts/cinzel-latin-700-normal.woff2') format('woff2');
  }
  @font-face{
    font-family:'Cardo'; font-style:normal; font-weight:400; font-display:swap;
    src:url('fonts/cardo-latin-400-normal.woff2') format('woff2');
  }
  @font-face{
    font-family:'Cardo'; font-style:normal; font-weight:700; font-display:swap;
    src:url('fonts/cardo-latin-700-normal.woff2') format('woff2');
  }
  @font-face{
    font-family:'Cardo'; font-style:italic; font-weight:400; font-display:swap;
    src:url('fonts/cardo-latin-400-italic.woff2') format('woff2');
  }
  html,body{
    margin:0; padding:0; background:transparent; overflow:hidden;
    font-family:'Cardo',Georgia,serif; color:#f1f7f8;
    width:100%; height:100%;
  }
  /* ── Auto-Fit (siehe fitOverlay()): die aktive Box sitzt oben links und
     wird per transform in den Zielbereich eingepasst. width:max-content
     verhindert, dass Text umbricht, wenn die Quelle schmaler ist als die Box. */
  .overlay-box{position:absolute; left:0; top:0; width:max-content; transform-origin:0 0;}
  .overlay-box{
    position:relative; display:inline-flex; flex-direction:column; align-items:center; gap:10px;
    background:linear-gradient(180deg, rgba(15,22,30,0.88), rgba(6,9,14,0.88));
    border:1px solid rgba(199,167,94,0.5);
    border-radius:14px;
    padding:20px 40px 24px;
    box-shadow:inset 0 0 36px rgba(127,214,206,0.05);
    backdrop-filter:blur(2px);
    transition:border-color .4s, box-shadow .4s;
  }
  .overlay-box.is-success{
    border-color:rgba(143,224,168,0.6);
    box-shadow:inset 0 0 36px rgba(92,174,116,0.08);
  }
  /* Steel-Soul-Box mit fester Mindestbreite, damit sie beim Wechsel
     laufend → geschafft nicht schmaler wird (und dadurch nicht springt) */
  #steelsoul-view{min-width:480px; box-sizing:border-box;}

  .flourish{position:absolute; width:34px; height:34px; opacity:0.85; pointer-events:none;}
  .flourish.tl{top:6px; left:6px;}
  .flourish.tr{top:6px; right:6px; transform:scaleX(-1);}
  .flourish.bl{bottom:6px; left:6px; transform:scaleY(-1);}
  .flourish.br{bottom:6px; right:6px; transform:scale(-1,-1);}
  .flourish path{stroke:#c7a75e; transition:stroke .4s;}
  .flourish circle{fill:#c7a75e; transition:fill .4s;}
  .overlay-box.is-success .flourish path{stroke:#8fe0a8;}
  .overlay-box.is-success .flourish circle{fill:#8fe0a8;}

  .view-title{
    font-family:'Cinzel',serif; font-size:18px; font-weight:600; letter-spacing:0.2em; text-transform:uppercase;
    color:#e9cf94; opacity:0.9; text-shadow:0 0 12px rgba(199,167,94,0.35);
    padding-bottom:8px; margin-bottom:2px; width:100%; text-align:center;
    border-bottom:1px solid rgba(140,185,195,0.25);
  }

  .content-row{display:flex; align-items:center; gap:28px;}

  .attempt-block{text-align:center; padding-right:28px; border-right:1px solid rgba(140,185,195,0.3);}
  .attempt-label{font-family:'Cinzel',serif; font-size:16px; letter-spacing:0.18em; text-transform:uppercase; color:#9fb3ba;}
  .attempt-number{font-family:'Cinzel',serif; font-size:76px; font-weight:700; color:#c3f5ee; line-height:1; text-shadow:0 0 26px rgba(127,214,206,0.6); margin-top:2px;}

  .info-block{display:flex; flex-direction:column; gap:10px; min-width:220px;}
  .info-row{font-size:22px; display:flex; align-items:baseline; gap:10px;}
  .info-row .k{font-family:'Cinzel',serif; font-size:14px; letter-spacing:0.04em; color:#9fb3ba; font-style:normal; flex-shrink:0;}
  .info-row.pb .k{font-size:18px;}
  .info-row.timer .k{font-size:18px;}
  .info-row .v{color:#f1f7f8; font-weight:700; font-size:26px;}
  .info-row.pb .v{color:#d5c8ff; text-shadow:0 0 14px rgba(164,138,240,0.4);}
  .info-row.timer .v{
    color:#e9cf94; font-family:'Cinzel',serif; font-variant-numeric:tabular-nums;
    text-shadow:0 0 14px rgba(199,167,94,0.4);
  }
  .info-row.timer .v.is-running{color:#8fe0a8; text-shadow:0 0 14px rgba(92,174,116,0.45);}

  /* ── Erfolgs-Ansicht: ersetzt den normalen Content-Row komplett ── */
  .clear-summary{display:none; flex-direction:column; align-items:center; gap:6px; text-align:center; min-width:260px;}
  .clear-label{
    font-family:'Cinzel',serif; font-size:19px; font-weight:700; letter-spacing:0.04em;
    color:#8fe0a8; text-shadow:0 0 16px rgba(92,174,116,0.5);
  }
  .clear-value{
    font-family:'Cinzel',serif; font-size:54px; font-weight:700; color:#c3f5ee; line-height:1;
    text-shadow:0 0 26px rgba(127,214,206,0.6); margin-top:2px;
  }
  .clear-sub{font-family:'Cinzel',serif; font-size:14px; color:#9fb3ba; letter-spacing:0.06em; margin-top:2px;}

  .ticker-wrap{width:280px; overflow:hidden; margin-top:10px; mask-image:linear-gradient(90deg, transparent, black 12%, black 88%, transparent);}
  .ticker-track{display:inline-flex; gap:22px; white-space:nowrap; animation:ticker-scroll 67s linear infinite;}
  .ticker-track span{font-family:'Cinzel',serif; font-size:14px; color:#e9cf94; letter-spacing:0.03em;}
  /* ── Prozent-Walze (Odometer, nach Vorbild Gaming-Olympiade) ──
     Größen in em, damit's in der kleinen (26px) und großen (54px) Anzeige passt */
  .pct-digit{position:relative; display:inline-block; line-height:1.2em; clip-path:inset(0 -0.5em);}
  .pct-sizer{visibility:hidden;}
  .pct-strip{position:absolute; left:50%; top:0; display:flex; flex-direction:column; transform:translateX(-50%); will-change:transform;}
  .pct-cell{display:block; height:1.2em; line-height:1.2em; text-align:center;}
  .pct-digit--enter{opacity:0; transition:opacity .4s ease;}
  .pct-digit--enter-active{opacity:1;}
  @keyframes pct-pulse{
    0%{filter:brightness(1);} 40%{filter:brightness(1.6) drop-shadow(0 0 10px rgba(143,224,168,0.8));} 100%{filter:brightness(1);}
  }
  @keyframes pct-pulse-down{
    0%{filter:brightness(1);} 40%{filter:brightness(1.3) drop-shadow(0 0 10px rgba(230,110,110,0.8));} 100%{filter:brightness(1);}
  }
  .pct-pulse-up{animation:pct-pulse 1.5s ease;}
  .pct-pulse-down{animation:pct-pulse-down 1.5s ease;}
  @keyframes ticker-scroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }

  /* ── Silksong: Titel mit Masken-Icon links und rechts ── */
  .sk-title{display:flex; align-items:center; justify-content:center; gap:14px;}
  .sk-title-text{margin-right:-0.2em;} /* letter-spacing hinter dem letzten Buchstaben ausgleichen, sonst sitzt das Wort nicht mittig */
  .title-icon{
    height:26px; width:auto; flex-shrink:0;
    filter:drop-shadow(0 0 6px rgba(199,167,94,0.35));
  }

  /* ── Silksong: Boss-Durchlauf ──
     Beide Panels liegen per Grid übereinander in derselben Zelle. Der
     Showcase trägt mit width:0/min-width:100% nichts zur Breite bei, dadurch
     bleibt die Box exakt so breit wie die normale Tode/Bosse-Anzeige und
     springt beim Umschalten nicht. Lange Namen brechen einfach um. */
  .sk-stage{display:grid;}
  .sk-panel{grid-area:1 / 1; transition:opacity .6s ease;}
  .sk-showcase{
    width:0; min-width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    text-align:center; opacity:0;
  }
  .sk-stage.is-showcase #sk-normal{opacity:0;}
  .sk-stage.is-showcase .sk-showcase{opacity:1;}
  .sk-boss-name{
    font-family:'Cinzel',serif; font-size:32px; font-weight:700; line-height:1.15;
    color:#c3f5ee; text-shadow:0 0 22px rgba(127,214,206,0.55);
    text-wrap:balance; overflow-wrap:anywhere;
    transition:opacity .4s ease, transform .4s ease;
  }
  .sk-boss-name.is-out{opacity:0; transform:translateY(8px);}
  .sk-boss-count{font-family:'Cinzel',serif; font-size:14px; color:#9fb3ba; letter-spacing:0.08em; font-variant-numeric:tabular-nums;}
</style>

<script>
  function bossLabel(n){ return n + (n === 1 ? ' Boss' : ' Bosse'); }

  // "80" / "80%" / "80,5 %" → "80 %" bzw. "80,5 %". Leer → ''.
  function formatPercent(raw){
    const v = (raw || '').toString().trim().replace(/\s*%$/, '');
    return v ? v + ' %' : '';
  }

  // ── Prozent-Odometer (nach Vorbild Gaming-Olympiade: Ziffern rollen) ──
  const PCT_DURATION_MS = 1500;   // Dauer der Walzen-Animation

  function pctToNumber(v){ return parseFloat(String(v).replace(',', '.')); }

  // Zerlegt "83,42" in Vorkomma "83", Trennzeichen ",", Nachkomma "42"
  function splitPct(v){
    const m = String(v).match(/^(\d*)([.,]?)(\d*)$/);
    return m ? { int: m[1], sep: m[2], frac: m[3] } : null;
  }

  function pctDigitHTML(ch, cells, offsetSteps){
    const strip = cells.map(c => `<span class="pct-cell">${c}</span>`).join('');
    const tf = offsetSteps ? ` style="transform:translate(-50%, -${offsetSteps * 1.2}em)"` : '';
    return `<span class="pct-digit"><span class="pct-sizer">${ch}</span><span class="pct-strip"${tf}>${strip}</span></span>`;
  }

  function staticPctHTML(v){
    return String(v).split('').map(ch => pctDigitHTML(ch, [ch], 0)).join('') + ' %';
  }

  // Setzt den Prozentwert in el. Bei Änderung rollt jede geänderte Ziffer zur
  // neuen: steigt der Wert, kommt die neue Ziffer von oben (wie bei der
  // Olympiade), sinkt er, kommt sie von unten. Unveränderte Werte werden
  // nicht angefasst, damit der 5-Sekunden-Refresh nichts neu aufbaut.
  function setPercent(el, raw){
    const v = (raw || '').toString().trim().replace(/\s*%$/, '');
    const prev = el.dataset.pct;
    if(prev === v) return;
    el.dataset.pct = v;

    const a = prev !== undefined ? splitPct(prev) : null;
    const b = splitPct(v);
    const n0 = prev !== undefined ? pctToNumber(prev) : NaN;
    const n1 = pctToNumber(v);
    // Erstes Laden oder kein reiner Zahlenwert → ohne Animation anzeigen
    if(!a || !b || !v || !prev || isNaN(n0) || isNaN(n1) || n0 === n1){
      el.innerHTML = v ? staticPctHTML(v) : '';
      return;
    }
    const up = n1 > n0;

    // Vorkomma rechtsbündig, Nachkomma linksbündig aneinander ausrichten
    const intLen = Math.max(a.int.length, b.int.length);
    const fracLen = Math.max(a.frac.length, b.frac.length);
    const sepLen = (a.sep || b.sep) ? 1 : 0;
    const oldStr = a.int.padStart(intLen, ' ') + (sepLen ? (a.sep || ' ') : '') + a.frac.padEnd(fracLen, ' ');
    const newStr = b.int.padStart(intLen, ' ') + (sepLen ? (b.sep || ' ') : '') + b.frac.padEnd(fracLen, ' ');

    let html = '';
    const entering = [];
    for(let i = 0; i < newStr.length; i++){
      const o = oldStr[i], nw = newStr[i];
      if(nw === ' ') continue;                       // Stelle fällt weg
      if(o === nw || !/\d/.test(nw)){ html += pctDigitHTML(nw, [nw], 0); continue; }
      if(!/\d/.test(o)){                             // neue Stelle → einblenden
        html += pctDigitHTML(nw, [nw], 0).replace('class="pct-digit"', `class="pct-digit pct-digit--enter" data-enter="${i}"`);
        entering.push(i);
        continue;
      }
      const d0 = +o, d1 = +nw;
      if(up){
        // Walze oben = Ziel, unten = alt; startet unten und rollt nach oben ins Ziel
        const steps = (d1 - d0 + 10) % 10;
        const seq = Array.from({length: steps + 1}, (_, p) => (d0 + (steps - p)) % 10);
        html += pctDigitHTML(nw, seq, steps).replace('class="pct-strip"', 'class="pct-strip" data-to="0"');
      } else {
        // Walze oben = alt, unten = Ziel; startet oben und rollt nach unten ins Ziel
        const steps = (d0 - d1 + 10) % 10;
        const seq = Array.from({length: steps + 1}, (_, p) => (d0 - p + 10) % 10);
        html += pctDigitHTML(nw, seq, 0).replace('class="pct-strip"', `class="pct-strip" data-to="${steps}"`);
      }
    }
    el.innerHTML = html + ' %';

    void el.offsetHeight; // Reflow, damit die Transition greift
    requestAnimationFrame(() => {
      el.querySelectorAll('.pct-strip[data-to]').forEach(strip => {
        strip.style.transition = `transform ${PCT_DURATION_MS}ms cubic-bezier(0.45, 0, 0.15, 1)`;
        strip.style.transform = `translate(-50%, -${strip.dataset.to * 1.2}em)`;
      });
      el.querySelectorAll('.pct-digit--enter').forEach(d => d.classList.add('pct-digit--enter-active'));
    });

    // kurzer Glow-Puls: grün beim Steigen, rötlich beim Sinken
    el.classList.remove('pct-pulse-up', 'pct-pulse-down');
    void el.offsetWidth;
    el.classList.add(up ? 'pct-pulse-up' : 'pct-pulse-down');

    // Aufräumen: Walzen wieder auf eine Zelle reduzieren
    clearTimeout(el._pctCleanup);
    el._pctCleanup = setTimeout(() => {
      if(el.dataset.pct === v) el.innerHTML = staticPctHTML(v);
    }, PCT_DURATION_MS + 60);
  }

  function renderTicker(trackEl, bosses){
    if(!bosses || !bosses.length){ trackEl.innerHTML = ''; return; }
    const items = bosses.map(b => `<span>${b}</span>`).join('');
    // Liste doppelt rendern für nahtlose Endlosschleife
    trackEl.innerHTML = items + items;
  }

  // ── Steel Soul rendering ──
  function renderSteelSoul(runs, stats){
    const current = stats.currentRun;
    const isSuccess = !!(current && current.success);

    document.getElementById('steelsoul-view').classList.toggle('is-success', isSuccess);
    document.getElementById('ss-normal').style.display = isSuccess ? 'none' : 'flex';
    document.getElementById('ss-clear').style.display = isSuccess ? 'flex' : 'none';

    if(isSuccess){
      document.getElementById('ss-clear-attempt').textContent = current.attempt;
      document.getElementById('ss-clear-count').textContent = bossLabel(current.bossesKilled) + ' besiegt';

      // Prozent aus Spalte D – nur anzeigen, wenn beim geschafften Run was drinsteht
      const clearPercent = formatPercent(current.percent);
      const clearPercentEl = document.getElementById('ss-clear-percent');
      clearPercentEl.style.display = clearPercent ? 'block' : 'none';
      setPercent(clearPercentEl, current.percent);
      renderTicker(document.getElementById('ss-ticker-track'), current.bosses);
    } else {
      document.getElementById('ov-attempt').textContent = stats.currentAttempt ?? '–';
      document.getElementById('ov-pb').textContent = stats.bestBossesKilled ? bossLabel(stats.bestBossesKilled) : '–';
      document.getElementById('ov-bosses').textContent = current ? bossLabel(current.bossesKilled) : '–';

      // Prozent aus Spalte D – nur anzeigen, wenn beim aktuellen Run was drinsteht
      const percent = formatPercent(current && current.percent);
      document.getElementById('ov-percent-row').style.display = percent ? 'flex' : 'none';
      setPercent(document.getElementById('ov-percent'), current && current.percent);
    }
  }
  SteelSoul.startPolling(renderSteelSoul, (err) => console.error('Steel Soul Overlay:', err));

  // ── Pantheon 5 rendering ──
  function renderPantheon(state){
    // Bleibt dauerhaft bei der "Geschafft"-Ansicht, sobald einmal ein Clear
    // passiert ist – auch wenn danach neue Versuche (Run 2, 3, ...) folgen.
    const justCleared = !!state.clearedRun;

    document.getElementById('pantheon-view').classList.toggle('is-success', justCleared);
    document.getElementById('p5-normal').style.display = justCleared ? 'none' : 'flex';
    document.getElementById('p5-clear').style.display = justCleared ? 'flex' : 'none';

    if(justCleared){
      document.getElementById('p5-clear-attempt').textContent = state.clearedRun.attempt;
      document.getElementById('p5-clear-time').textContent = PantheonSoul.formatElapsed(state.clearedRun.completionMs);
    } else {
      const attemptEl = document.getElementById('p5-attempt');
      attemptEl.textContent = state.current ? state.current.attempt : '–';

      const pbEl = document.getElementById('p5-pb');
      if(state.clearedRun){
        const time = PantheonSoul.formatElapsed(state.clearedRun.completionMs);
        pbEl.textContent = `Geschafft im ${state.clearedRun.attempt}. Versuch — ${time}`;
      } else if(state.pbBoss){
        pbEl.textContent = state.pbBoss;
      } else {
        pbEl.textContent = '–';
      }
    }

    PantheonSoul.setTimerState(state.timerStartTs, state.timerElapsedOffset);
  }

  async function pollPantheon(){
    try{
      const state = await PantheonSoul.fetchPantheonState();
      renderPantheon(state);
    }catch(err){
      console.error('Pantheon Overlay:', err);
    }
    setTimeout(pollPantheon, STEELSOUL_CONFIG.refreshIntervalMs);
  }
  pollPantheon();

  // ── Silksong rendering ──
  // Boss-Durchlauf: Die Bosse aus C2 werden nacheinander eingeblendet.
  //  • automatisch alle intervalMs (Standard 3 min), gezählt ab Ende des
  //    letzten Durchlaufs und nur, solange die Silksong-Ansicht aktiv ist
  //  • D1 angehakt → Durchlauf startet sofort und wiederholt sich, bis das
  //    Häkchen wieder raus ist; danach beginnen die 3 min von vorn
  const SK_SHOW     = STEELSOUL_CONFIG.silksongBossShowcase || {};
  const SK_INTERVAL = SK_SHOW.intervalMs || 180000;
  const SK_PER_BOSS = SK_SHOW.perBossMs || 3500;
  const SK_FADE_MS  = 400;   // passend zur CSS-Transition von .sk-boss-name

  let skBossList  = [];      // aktuelle Liste aus C2
  let skManual    = false;   // Zustand der Checkbox D1
  let skShowcase  = null;    // laufender Durchlauf: { list, timer }
  let skNextAutoAt = 0;      // Zeitpunkt des nächsten Auto-Durchlaufs (0 = noch nicht geplant)

  function skIsVisible(){
    return document.getElementById('silksong-view').style.display !== 'none';
  }

  function skShowBoss(i){
    const nameEl  = document.getElementById('sk-boss-name');
    const countEl = document.getElementById('sk-boss-count');
    const list = skShowcase.list;
    nameEl.classList.add('is-out');
    skShowcase.timer = setTimeout(() => {
      nameEl.textContent  = list[i];
      countEl.textContent = (i + 1) + ' / ' + list.length;
      nameEl.classList.remove('is-out');
      skShowcase.timer = setTimeout(() => {
        if(i + 1 < list.length) skShowBoss(i + 1);
        else skEndShowcase();
      }, SK_PER_BOSS);
    }, SK_FADE_MS);
  }

  function skStartShowcase(){
    if(!skBossList.length) return false;
    skShowcase = { list: skBossList.slice(), timer: null };  // Snapshot, damit Updates nicht mitten reinfunken
    document.getElementById('sk-stage').classList.add('is-showcase');
    skShowBoss(0);
    return true;
  }

  function skStopShowcase(){
    if(skShowcase) clearTimeout(skShowcase.timer);
    skShowcase = null;
    document.getElementById('sk-stage').classList.remove('is-showcase');
    document.getElementById('sk-boss-name').classList.add('is-out');
    skNextAutoAt = Date.now() + SK_INTERVAL;
  }

  function skEndShowcase(){
    // D1 noch angehakt → mit frischer Liste direkt von vorn
    if(skManual && skIsVisible() && skBossList.length){
      skShowcase.list = skBossList.slice();
      skShowBoss(0);
    } else {
      skStopShowcase();
    }
  }

  function skSchedulerTick(){
    if(!skIsVisible()){
      if(skShowcase) skStopShowcase();
      skNextAutoAt = 0;          // 3 min starten erst, wenn die Ansicht wieder aktiv ist
      return;
    }
    if(!skNextAutoAt) skNextAutoAt = Date.now() + SK_INTERVAL;
    if(skShowcase) return;
    if(skManual || Date.now() >= skNextAutoAt){
      if(!skStartShowcase()) skNextAutoAt = Date.now() + SK_INTERVAL; // leere Liste → später nochmal
    }
  }
  setInterval(skSchedulerTick, 1000);

  function renderSilksong(state){
    document.getElementById('sk-deaths').textContent = state.deaths;
    document.getElementById('sk-bosses').textContent = state.bosses;

    skBossList = state.bossList || [];
    const wasManual = skManual;
    skManual = !!state.showBossesNow;
    if(wasManual && !skManual && skShowcase) skStopShowcase();  // Häkchen raus → sofort zurück
    if(!wasManual && skManual) skSchedulerTick();               // Häkchen rein → sofort starten
  }

  async function pollSilksong(){
    try{
      const state = await PantheonSoul.fetchSilksongState();
      renderSilksong(state);
    }catch(err){
      console.error('Silksong Overlay:', err);
    }
    // schneller Takt, damit die D1-Checkbox zügig reagiert
    setTimeout(pollSilksong, STEELSOUL_CONFIG.controlPollIntervalMs || STEELSOUL_CONFIG.refreshIntervalMs);
  }
  pollSilksong();

  // Timer-Anzeige tickt lokal jede Sekunde, unabhängig vom Netzwerk-Poll
  setInterval(() => {
    const timerEl = document.getElementById('p5-timer');
    timerEl.textContent = PantheonSoul.formatElapsed(PantheonSoul.currentElapsedMs());
    timerEl.classList.toggle('is-running', !!PantheonSoul.currentlyRunning && PantheonSoul.currentlyRunning());
  }, 1000);

  // ── Auto-Fit: aktive Box so skalieren, dass sie komplett in den
  //    Zielbereich passt (vergrößert und verkleinert), mittig darin ──
  //  Zielbereich:
  //   • overlay.html?w=480&h=200 → fester Bereich 480×200 px oben links.
  //     Für die Einbettung als iFrame (z.B. im Overlay-Control), weil der
  //     iFrame dort viel höher ist als der sichtbare Ausschnitt.
  //   • direkt als OBS-Browserquelle → die Größe der Quelle (Fenstergröße)
  //   • als iFrame ohne w/h → keine Skalierung, Box oben links in
  //     Originalgröße (wie früher). Mit ?fit=1 trotzdem an Fenster anpassen,
  //     mit ?fit=0 überall abschalten.
  const FIT_MARGIN_PX = 4;   // kleiner Rand, damit Ecken/Schatten nicht angeschnitten werden
  const FIT_TARGET = (() => {
    const q = new URLSearchParams(location.search);
    const w = parseInt(q.get('w'), 10), h = parseInt(q.get('h'), 10);
    if(w > 0 && h > 0) return { w, h };
    if(q.get('fit') === '0') return null;
    if(q.get('fit') === '1') return 'window';
    let embedded;
    try { embedded = window.self !== window.top; } catch(e){ embedded = true; }
    return embedded ? null : 'window';
  })();

  function fitOverlay(){
    document.querySelectorAll('.overlay-box').forEach(box => {
      if(box.style.display === 'none' || !FIT_TARGET){ box.style.transform = ''; return; }
      const areaW = FIT_TARGET === 'window' ? window.innerWidth  : FIT_TARGET.w;
      const areaH = FIT_TARGET === 'window' ? window.innerHeight : FIT_TARGET.h;
      // offsetWidth/-Height = Größe OHNE transform, also die "natürliche" Größe
      const w = box.offsetWidth, h = box.offsetHeight;
      if(!w || !h) return;
      const scale = Math.min((areaW - FIT_MARGIN_PX * 2) / w, (areaH - FIT_MARGIN_PX * 2) / h);
      const x = (areaW - w * scale) / 2, y = (areaH - h * scale) / 2;
      box.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
    });
    reportContentSize();
  }
  // ── Größe an die einbettende Seite melden (Overlay-Control/-Display) ──
  //  Ist das Overlay als iFrame eingebettet, schickt es die Größe der
  //  sichtbaren Box per postMessage an die Elternseite. Die passt dann ihren
  //  Rahmen daran an – so wird nichts abgeschnitten, wenn eine Ansicht größer ist.
  let _lastReportedSize = '';
  function reportContentSize(){
    if(window.parent === window || FIT_TARGET === 'window') return;
    let w, h;
    if(FIT_TARGET){ w = FIT_TARGET.w; h = FIT_TARGET.h; }
    else {
      const box = [...document.querySelectorAll('.overlay-box')].find(b => b.style.display !== 'none');
      if(!box) return;                         // gerade nichts sichtbar → letzte Größe behalten
      const r = box.getBoundingClientRect();
      w = Math.ceil(r.width); h = Math.ceil(r.height);
    }
    if(!w || !h) return;
    const key = w + 'x' + h;
    if(key === _lastReportedSize) return;
    _lastReportedSize = key;
    window.parent.postMessage({ type: 'overlay-content-size', width: w, height: h }, '*');
  }
  // Elternseite kann die Größe jederzeit neu anfordern (z.B. nach eigenem Reload)
  window.addEventListener('message', (e) => {
    if(e.data && e.data.type === 'overlay-content-size-request'){ _lastReportedSize = ''; reportContentSize(); }
  });
  window.addEventListener('resize', fitOverlay);
  // Inhalt ändert sich (Namen, Zahlen, Ansicht geschafft/laufend) → neu einpassen
  if(window.ResizeObserver){
    const ro = new ResizeObserver(fitOverlay);
    document.querySelectorAll('.overlay-box').forEach(box => ro.observe(box));
  }
  // Schriften laden verzögert → danach einmal nachmessen
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitOverlay);

  // ── Ansicht umschalten je nach "Overlay Config" Checkboxen ──
  // Reihenfolge bei mehreren Häkchen: Pantheon > Steel Soul > Silksong
  async function pollOverlayConfig(){
    try{
      const cfg = await PantheonSoul.fetchOverlayConfig();
      const showPantheon = cfg.showPantheon;
      const showSteelsoul = !showPantheon && cfg.showSteelsoul;
      const showSilksong = !showPantheon && !showSteelsoul && cfg.showSilksong;
      document.getElementById('pantheon-view').style.display = showPantheon ? 'inline-flex' : 'none';
      document.getElementById('steelsoul-view').style.display = showSteelsoul ? 'inline-flex' : 'none';
      document.getElementById('silksong-view').style.display = showSilksong ? 'inline-flex' : 'none';
      fitOverlay();
    }catch(err){
      console.error('Overlay Config:', err);
    }
    setTimeout(pollOverlayConfig, STEELSOUL_CONFIG.controlPollIntervalMs);
  }
  pollOverlayConfig();
</script>
</body>
</html>
