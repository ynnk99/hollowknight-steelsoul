<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steel Soul Overlay</title>
<script src="vendor/papaparse.min.js"></script>
<style>
  @font-face{
    font-family:'Cinzel'; font-style:normal; font-weight:600; font-display:swap;
    src:url('fonts/cinzel-latin-600-normal.woff2') format('woff2');
  }
  @font-face{
    font-family:'Cinzel'; font-style:normal; font-weight:700; font-display:swap;
    src:url('fonts/cinzel-latin-700-normal.woff2') format('woff2');
  }
  @font-face{
    font-family:'Cardo'; font-style:normal; font-weight:400; font-display:swap;
    src:url('fonts/cardo-latin-400-normal.woff2') format('woff2');
  }
  @font-face{
    font-family:'Cardo'; font-style:normal; font-weight:700; font-display:swap;
    src:url('fonts/cardo-latin-700-normal.woff2') format('woff2');
  }
  @font-face{
    font-family:'Cardo'; font-style:italic; font-weight:400; font-display:swap;
    src:url('fonts/cardo-latin-400-italic.woff2') format('woff2');
  }
  html,body{
    margin:0; padding:0; background:transparent; overflow:hidden;
    font-family:'Cardo',Georgia,serif; color:#f1f7f8;
  }
  .overlay-box{
    position:relative; display:inline-flex; flex-direction:column; align-items:center; gap:10px;
    background:linear-gradient(180deg, rgba(15,22,30,0.88), rgba(6,9,14,0.88));
    border:1px solid rgba(199,167,94,0.5);
    border-radius:14px;
    padding:20px 40px 24px;
    box-shadow:0 0 40px rgba(0,0,0,0.6), inset 0 0 36px rgba(127,214,206,0.05);
    backdrop-filter:blur(2px);
    transition:border-color .4s, box-shadow .4s;
  }
  .overlay-box.is-success{
    border-color:rgba(143,224,168,0.6);
    box-shadow:0 0 50px rgba(92,174,116,0.22), inset 0 0 36px rgba(92,174,116,0.08);
  }

  .flourish{position:absolute; width:34px; height:34px; opacity:0.85; pointer-events:none;}
  .flourish.tl{top:6px; left:6px;}
  .flourish.tr{top:6px; right:6px; transform:scaleX(-1);}
  .flourish.bl{bottom:6px; left:6px; transform:scaleY(-1);}
  .flourish.br{bottom:6px; right:6px; transform:scale(-1,-1);}
  .flourish path{stroke:#c7a75e; transition:stroke .4s;}
  .flourish circle{fill:#c7a75e; transition:fill .4s;}
  .overlay-box.is-success .flourish path{stroke:#8fe0a8;}
  .overlay-box.is-success .flourish circle{fill:#8fe0a8;}

  .success-banner{
    display:none; align-items:center; justify-content:center; gap:8px;
    font-family:'Cinzel',serif; font-size:16px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase;
    color:#8fe0a8; text-shadow:0 0 16px rgba(92,174,116,0.5);
  }
  .overlay-box.is-success .success-banner{display:flex;}

  .view-title{
    font-family:'Cinzel',serif; font-size:14px; font-weight:600; letter-spacing:0.2em; text-transform:uppercase;
    color:#e9cf94; opacity:0.9; text-shadow:0 0 12px rgba(199,167,94,0.35);
    padding-bottom:8px; margin-bottom:2px; width:100%; text-align:center;
    border-bottom:1px solid rgba(140,185,195,0.25);
  }

  .content-row{display:flex; align-items:center; gap:28px;}

  .attempt-block{text-align:center; padding-right:28px; border-right:1px solid rgba(140,185,195,0.3);}
  .attempt-label{font-family:'Cinzel',serif; font-size:14px; letter-spacing:0.18em; text-transform:uppercase; color:#9fb3ba;}
  .attempt-number{font-family:'Cinzel',serif; font-size:76px; font-weight:700; color:#c3f5ee; line-height:1; text-shadow:0 0 26px rgba(127,214,206,0.6); margin-top:2px;}
  .attempt-number.small-text{font-size:30px; max-width:220px;}
  .attempt-number.is-success{color:#8fe0a8; text-shadow:0 0 26px rgba(92,174,116,0.6);}

  .info-block{display:flex; flex-direction:column; gap:10px; min-width:220px;}
  .info-row{font-size:22px; display:flex; align-items:baseline; gap:10px;}
  .info-row .k{font-family:'Cinzel',serif; font-size:14px; letter-spacing:0.04em; color:#9fb3ba; font-style:normal; flex-shrink:0;}
  .info-row .v{color:#f1f7f8; font-weight:700; font-size:26px;}
  .info-row.pb .v{color:#d5c8ff; text-shadow:0 0 14px rgba(164,138,240,0.4); font-size:19px; max-width:300px; white-space:normal; line-height:1.3;}
  .info-row.timer .v{
    color:#e9cf94; font-family:'Cinzel',serif; font-variant-numeric:tabular-nums;
    text-shadow:0 0 14px rgba(199,167,94,0.4);
  }
  .info-row.timer .v.is-running{color:#8fe0a8; text-shadow:0 0 14px rgba(92,174,116,0.45);}
</style>
</head>
<body>

  <!-- ── STEEL SOUL VIEW ── -->
  <div class="overlay-box" id="steelsoul-view" style="display:none;">
    <svg class="flourish tl" viewBox="0 0 34 34"><path d="M2 20 C2 8, 8 2, 20 2" fill="none" stroke-width="1.3"/><path d="M2 20 C6 20, 9 17, 9 12" fill="none" stroke-width="1"/><circle cx="20" cy="2" r="1.6"/><circle cx="2" cy="20" r="1.6"/></svg>
    <svg class="flourish tr" viewBox="0 0 34 34"><path d="M2 20 C2 8, 8 2, 20 2" fill="none" stroke-width="1.3"/><path d="M2 20 C6 20, 9 17, 9 12" fill="none" stroke-width="1"/><circle cx="20" cy="2" r="1.6"/><circle cx="2" cy="20" r="1.6"/></svg>
    <svg class="flourish bl" viewBox="0 0 34 34"><path d="M2 20 C2 8, 8 2, 20 2" fill="none" stroke-width="1.3"/><path d="M2 20 C6 20, 9 17, 9 12" fill="none" stroke-width="1"/><circle cx="20" cy="2" r="1.6"/><circle cx="2" cy="20" r="1.6"/></svg>
    <svg class="flourish br" viewBox="0 0 34 34"><path d="M2 20 C2 8, 8 2, 20 2" fill="none" stroke-width="1.3"/><path d="M2 20 C6 20, 9 17, 9 12" fill="none" stroke-width="1"/><circle cx="20" cy="2" r="1.6"/><circle cx="2" cy="20" r="1.6"/></svg>
    <div class="view-title">Steel Soul</div>
    <div class="success-banner">✓ Versuch geschafft</div>
    <div class="content-row">
      <div class="attempt-block">
        <div class="attempt-label">Versuch</div>
        <div class="attempt-number" id="ov-attempt">–</div>
      </div>
      <div class="info-block">
        <div class="info-row"><span class="k">Bosse (aktuell)</span><span class="v" id="ov-bosses">–</span></div>
        <div class="info-row pb"><span class="k">PB</span><span class="v" id="ov-pb">–</span></div>
      </div>
    </div>
  </div>

  <!-- ── PANTHEON 5 VIEW ── -->
  <div class="overlay-box" id="pantheon-view" style="display:none;">
    <svg class="flourish tl" viewBox="0 0 34 34"><path d="M2 20 C2 8, 8 2, 20 2" fill="none" stroke-width="1.3"/><path d="M2 20 C6 20, 9 17, 9 12" fill="none" stroke-width="1"/><circle cx="20" cy="2" r="1.6"/><circle cx="2" cy="20" r="1.6"/></svg>
    <svg class="flourish tr" viewBox="0 0 34 34"><path d="M2 20 C2 8, 8 2, 20 2" fill="none" stroke-width="1.3"/><path d="M2 20 C6 20, 9 17, 9 12" fill="none" stroke-width="1"/><circle cx="20" cy="2" r="1.6"/><circle cx="2" cy="20" r="1.6"/></svg>
    <svg class="flourish bl" viewBox="0 0 34 34"><path d="M2 20 C2 8, 8 2, 20 2" fill="none" stroke-width="1.3"/><path d="M2 20 C6 20, 9 17, 9 12" fill="none" stroke-width="1"/><circle cx="20" cy="2" r="1.6"/><circle cx="2" cy="20" r="1.6"/></svg>
    <svg class="flourish br" viewBox="0 0 34 34"><path d="M2 20 C2 8, 8 2, 20 2" fill="none" stroke-width="1.3"/><path d="M2 20 C6 20, 9 17, 9 12" fill="none" stroke-width="1"/><circle cx="20" cy="2" r="1.6"/><circle cx="2" cy="20" r="1.6"/></svg>
    <div class="view-title">Pantheon 5</div>
    <div class="success-banner">✓ Pantheon vollständig geschafft</div>
    <div class="content-row">
      <div class="attempt-block">
        <div class="attempt-label">Versuch</div>
        <div class="attempt-number" id="p5-attempt">–</div>
      </div>
      <div class="info-block">
        <div class="info-row pb"><span class="k">PB</span><span class="v" id="p5-pb">–</span></div>
        <div class="info-row timer"><span class="k">Timer</span><span class="v" id="p5-timer">00:00</span></div>
      </div>
    </div>
  </div>

<script src="steelsoul-config.js"></script>
<script src="steelsoul-data.js"></script>
<script src="pantheon-data.js"></script>
<script>
  function bossLabel(n){ return n + (n === 1 ? ' Boss' : ' Bosse'); }

  // ── Steel Soul rendering ──
  function renderSteelSoul(runs, stats){
    document.getElementById('ov-attempt').textContent = stats.currentAttempt ?? '–';
    document.getElementById('ov-pb').textContent = stats.bestBossesKilled ? bossLabel(stats.bestBossesKilled) : '–';
    const current = stats.currentRun;
    document.getElementById('ov-bosses').textContent = current ? bossLabel(current.bossesKilled) : '–';

    const isSuccess = !!(current && current.success);
    document.getElementById('steelsoul-view').classList.toggle('is-success', isSuccess);
    document.getElementById('ov-attempt').classList.toggle('is-success', isSuccess);
  }
  SteelSoul.startPolling(renderSteelSoul, (err) => console.error('Steel Soul Overlay:', err));

  // ── Pantheon 5 rendering ──
  function renderPantheon(state){
    const box = document.getElementById('pantheon-view');
    const attemptEl = document.getElementById('p5-attempt');

    // Große grüne Feier-Karte: nur solange kein neuer Versuch offen ist
    const justCleared = !state.current && !!state.clearedRun;

    box.classList.toggle('is-success', justCleared);
    attemptEl.classList.toggle('is-success', justCleared);

    if(state.current){
      attemptEl.textContent = '#' + state.current.attempt;
      attemptEl.classList.remove('small-text');
    } else if(justCleared){
      attemptEl.textContent = 'Geschafft!';
      attemptEl.classList.add('small-text');
    } else {
      attemptEl.textContent = '–';
      attemptEl.classList.remove('small-text');
    }

    // PB-Zeile: bleibt dauerhaft stehen, auch wenn danach neue Versuche folgen
    const pbEl = document.getElementById('p5-pb');
    if(state.clearedRun){
      const time = PantheonSoul.formatElapsed(state.clearedRun.completionMs);
      pbEl.textContent = `Geschafft im ${state.clearedRun.attempt}. Versuch — ${time}`;
    } else if(state.pbBoss){
      pbEl.textContent = state.pbBoss;
    } else {
      pbEl.textContent = '–';
    }

    PantheonSoul.setTimerState(state.timerStartTs, state.timerElapsedOffset);
  }

  async function pollPantheon(){
    try{
      const state = await PantheonSoul.fetchPantheonState();
      renderPantheon(state);
    }catch(err){
      console.error('Pantheon Overlay:', err);
    }
    setTimeout(pollPantheon, STEELSOUL_CONFIG.refreshIntervalMs);
  }
  pollPantheon();

  // Timer-Anzeige tickt lokal jede Sekunde, unabhängig vom Netzwerk-Poll
  setInterval(() => {
    const timerEl = document.getElementById('p5-timer');
    timerEl.textContent = PantheonSoul.formatElapsed(PantheonSoul.currentElapsedMs());
    timerEl.classList.toggle('is-running', !!PantheonSoul.currentlyRunning && PantheonSoul.currentlyRunning());
  }, 1000);

  // ── Ansicht umschalten je nach "Overlay Config" Checkboxen ──
  async function pollOverlayConfig(){
    try{
      const cfg = await PantheonSoul.fetchOverlayConfig();
      const showPantheon = cfg.showPantheon;
      const showSteelsoul = !showPantheon && cfg.showSteelsoul;
      document.getElementById('pantheon-view').style.display = showPantheon ? 'inline-flex' : 'none';
      document.getElementById('steelsoul-view').style.display = showSteelsoul ? 'inline-flex' : 'none';
    }catch(err){
      console.error('Overlay Config:', err);
    }
    setTimeout(pollOverlayConfig, STEELSOUL_CONFIG.controlPollIntervalMs);
  }
  pollOverlayConfig();
</script>
</body>
</html>
